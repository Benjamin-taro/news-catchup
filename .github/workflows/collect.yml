name: Collect feeds (Matcha)

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vault-write
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  MATCHA_VERSION: v0.9.0

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Matcha
        run: |
          curl -sSL -o /usr/local/bin/matcha \
            "https://github.com/piqoni/matcha/releases/download/${MATCHA_VERSION}/matcha-linux-amd64"
          chmod +x /usr/local/bin/matcha
      - name: Collect
        run: scripts/collect.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add inbox _system/matcha/matcha.db
          git diff --cached --quiet && exit 0
          git commit -m "Collect $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
