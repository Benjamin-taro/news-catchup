name: Collect feeds (Matcha)

on:
  # 通常の収集は curate.yml が「今日の収集データがなければ先に集める」形で行う。
  # このワークフローは手動で取り直したいとき用
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vault-write
  cancel-in-progress: false

env:
  TZ: Europe/London
  MATCHA_VERSION: v0.9.0

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Time zone gate
        id: gate
        run: scripts/tz_gate.sh "${{ github.event.schedule }}" 5
      - name: Install Matcha
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -sSL -o /usr/local/bin/matcha \
            "https://github.com/piqoni/matcha/releases/download/${MATCHA_VERSION}/matcha-linux-amd64"
          chmod +x /usr/local/bin/matcha
      - name: Collect
        if: steps.gate.outputs.run == 'true'
        run: scripts/collect.sh
      - name: Commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add inbox _system/matcha/matcha.db
          git diff --cached --quiet && exit 0
          git commit -m "Collect $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
