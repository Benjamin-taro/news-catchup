name: Build wiki notes

# サイトのボタンや Obsidian で 👍 が付いたら（Digest が更新されたら）、知識ノートを作る
on:
  push:
    branches: [main]
    paths:
      - "Digest/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vault-write
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 scripts/build_wiki.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add wiki
          git diff --cached --quiet && exit 0
          git commit -m "Add wiki notes for new 👍"
          # 連続 push（サイトの投票など）と競合するので、間隔をばらして 10 回まで粘る
          for i in $(seq 1 10); do
            git pull --rebase -q && git push -q && exit 0
            sleep $((RANDOM % 7 + 2))
          done
          exit 1
