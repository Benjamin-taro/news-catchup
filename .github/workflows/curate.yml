name: Curate digest (Claude Code)

on:
  schedule:
    # GitHub の定期実行は数時間遅れたり飛ばされたりするので、1 回に頼らず何度も確認する。
    # daily：UTC 4:37〜12:37 の毎時（ロンドン時間の朝〜昼）。今日の Digest がまだなければ作る。
    # weekly：UTC 19:07〜23:07 の毎時（日曜）。ロンドン時間 20 時以降で、今週の Weekly がまだなければ作る。
    # 作成済みなら確認だけで終わる（Claude は起動しない）
    - cron: "37 4-12 * * *"
    - cron: "7 19-23 * * 0"
  workflow_dispatch:
    inputs:
      kind:
        description: "daily / weekly / check（認証と起動の確認だけ）"
        required: true
        default: daily
        type: choice
        options: [daily, weekly, check]
      force:
        description: "作成済みでも作り直す（先に既存ファイルを消しておくこと）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: vault-write
  cancel-in-progress: false

env:
  TZ: Europe/London

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Decide kind
        id: kind
        run: |
          sched="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # cron-job.org などの外部起動。作成済みならスキップ（force=true なら実行）
            kind="${{ inputs.kind }}"
            if [ "${{ inputs.force }}" != "true" ]; then
              if [ "$kind" = daily ] && [ -f "Digest/$(date +%F).md" ]; then kind=skip; echo "Digest/$(date +%F).md は作成済み"; fi
              if [ "$kind" = weekly ] && { [ "$(date +%u)" != 7 ] || [ "$(date +%H)" -lt 20 ]; }; then kind=skip; echo "週次は日曜 20 時以降のみ（force=true で強制実行）"; fi
              if [ "$kind" = weekly ] && [ -f "Weekly/$(date +%G-W%V).md" ]; then kind=skip; echo "Weekly/$(date +%G-W%V).md は作成済み"; fi
            fi
          elif [ "$sched" = "7 19-23 * * 0" ]; then
            week=$(date +%G-W%V)
            if [ "$(date +%u)" != 7 ] || [ "$(date +%H)" -lt 20 ]; then kind=skip; echo "まだ日曜 20 時前"
            elif [ -f "Weekly/$week.md" ]; then kind=skip; echo "Weekly/$week.md は作成済み"
            else kind=weekly; fi
          else
            if [ -f "Digest/$(date +%F).md" ]; then kind=skip; echo "Digest/$(date +%F).md は作成済み"
            else kind=daily; fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"; echo "kind=$kind"
      # 今日の収集データがまだなければ（収集の遅延・失敗）、先に収集する
      - name: Ensure today's input
        if: steps.kind.outputs.kind == 'daily'
        run: |
          f="inbox/matcha/$(date +%F).md"
          [ -f "$f" ] && { echo "input exists: $f"; exit 0; }
          echo "input missing: $f → collecting now"
          curl -sSL -o /usr/local/bin/matcha "https://github.com/piqoni/matcha/releases/download/v0.9.0/matcha-linux-amd64"
          chmod +x /usr/local/bin/matcha
          scripts/collect.sh
      # 👍 の記事から Obsidian 用の知識ノートを作る（週次レビューはこのノートを読んで育てる）
      - name: Build wiki notes
        if: steps.kind.outputs.kind == 'daily' || steps.kind.outputs.kind == 'weekly'
        run: python3 scripts/build_wiki.py
      # 週次：話題・キーワード・フィード別の集計と回帰分析を先に作る（週次レビューが Weekly に載せる。係数は日次の採点に使う）
      - name: Weekly stats
        if: steps.kind.outputs.kind == 'weekly'
        run: python3 scripts/weekly_stats.py
      - name: Install Claude Code
        if: steps.kind.outputs.kind != 'skip'
        run: npm install -g @anthropic-ai/claude-code
      - name: Check auth only
        if: steps.kind.outputs.kind == 'check'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: claude -p "動作確認です。「OK」とだけ返してください。" --allowedTools "Read"
      - name: Run curation
        if: steps.kind.outputs.kind != 'check' && steps.kind.outputs.kind != 'skip'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: scripts/curate.sh "${{ steps.kind.outputs.kind }}"
      # 週次レビューが検索キーワードを書き換えるので、設定が壊れていないか確かめる。壊れていたら元に戻す
      - name: Validate Matcha config
        if: steps.kind.outputs.kind == 'weekly'
        run: |
          if python3 scripts/check_config.py; then echo "config ok"; else
            echo "config が不正なので、週次レビュー前の内容に戻す"; git checkout -- _system/matcha/config.yaml
          fi
      - name: Add images
        if: steps.kind.outputs.kind != 'check' && steps.kind.outputs.kind != 'skip'
        run: python3 scripts/add_images.py
      - name: Commit
        id: commit
        if: steps.kind.outputs.kind != 'check' && steps.kind.outputs.kind != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add Digest Weekly wiki _system/news inbox _system/matcha
          git diff --cached --quiet && exit 0
          git commit -m "Curate ${{ steps.kind.outputs.kind }} $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && echo "pushed=1" >> "$GITHUB_OUTPUT" && exit 0; sleep 5; done
          exit 1
      # GITHUB_TOKEN での push は他のワークフローを起動しないので、Pages のデプロイを明示的に呼ぶ
      - name: Deploy site
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
