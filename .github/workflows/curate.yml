name: Curate digest (Claude Code)

on:
  schedule:
    # ロンドン時間の毎日 08:00（daily）と日曜 20:00（weekly）。夏時間・冬時間の 2 本ずつ置き、
    # scripts/tz_gate.sh でロンドン時間の目的の時刻にあたるほうだけを実行する
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 19 * * 0"
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      kind:
        description: "daily / weekly / check（認証と起動の確認だけ）"
        required: true
        default: daily
        type: choice
        options: [daily, weekly, check]

permissions:
  contents: write
  actions: write

concurrency:
  group: vault-write
  cancel-in-progress: false

env:
  TZ: Europe/London

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Decide kind
        id: kind
        run: |
          sched="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          elif [[ "$sched" == *" * * 0" ]]; then
            scripts/tz_gate.sh "$sched" 20 && grep -q "run=true" "$GITHUB_OUTPUT" && echo "kind=weekly" >> "$GITHUB_OUTPUT" || echo "kind=skip" >> "$GITHUB_OUTPUT"
          else
            scripts/tz_gate.sh "$sched" 8 && grep -q "run=true" "$GITHUB_OUTPUT" && echo "kind=daily" >> "$GITHUB_OUTPUT" || echo "kind=skip" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Claude Code
        if: steps.kind.outputs.kind != 'skip'
        run: npm install -g @anthropic-ai/claude-code
      - name: Check auth only
        if: steps.kind.outputs.kind == 'check'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: claude -p "動作確認です。「OK」とだけ返してください。" --allowedTools "Read"
      - name: Run curation
        if: steps.kind.outputs.kind != 'check' && steps.kind.outputs.kind != 'skip'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: scripts/curate.sh "${{ steps.kind.outputs.kind }}"
      - name: Add images
        if: steps.kind.outputs.kind != 'check' && steps.kind.outputs.kind != 'skip'
        run: python3 scripts/add_images.py
      - name: Commit
        id: commit
        if: steps.kind.outputs.kind != 'check' && steps.kind.outputs.kind != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add Digest Weekly wiki _system/news
          git diff --cached --quiet && exit 0
          git commit -m "Curate ${{ steps.kind.outputs.kind }} $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && echo "pushed=1" >> "$GITHUB_OUTPUT" && exit 0; sleep 5; done
          exit 1
      # GITHUB_TOKEN での push は他のワークフローを起動しないので、Pages のデプロイを明示的に呼ぶ
      - name: Deploy site
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
