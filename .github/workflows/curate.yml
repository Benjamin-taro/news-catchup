name: Curate digest (Claude Code)

on:
  schedule:
    # 通常は collect.yml が収集後にこのワークフローを呼ぶ。下の daily cron はその保険（ロンドン時間 07:37）。
    # weekly はロンドン時間の日曜 20:07。夏時間・冬時間の 2 本ずつ置き、scripts/tz_gate.sh で片方だけ動かす。
    # 毎時 0 分は GitHub 側が混雑して遅れやすいので、分をずらしている
    - cron: "37 6 * * *"
    - cron: "37 7 * * *"
    - cron: "7 19 * * 0"
    - cron: "7 20 * * 0"
  workflow_dispatch:
    inputs:
      kind:
        description: "daily / weekly / check（認証と起動の確認だけ）"
        required: true
        default: daily
        type: choice
        options: [daily, weekly, check]

permissions:
  contents: write
  actions: write

concurrency:
  group: vault-write
  cancel-in-progress: false

env:
  TZ: Europe/London

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Decide kind
        id: kind
        run: |
          sched="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          elif [[ "$sched" == *" * * 0" ]]; then
            scripts/tz_gate.sh "$sched" 20 && grep -q "run=true" "$GITHUB_OUTPUT" && echo "kind=weekly" >> "$GITHUB_OUTPUT" || echo "kind=skip" >> "$GITHUB_OUTPUT"
          else
            scripts/tz_gate.sh "$sched" 7 && grep -q "run=true" "$GITHUB_OUTPUT" && echo "kind=daily" >> "$GITHUB_OUTPUT" || echo "kind=skip" >> "$GITHUB_OUTPUT"
          fi
      # 今日の収集データがまだなければ（収集の遅延・失敗）、先に収集する
      - name: Ensure today's input
        if: steps.kind.outputs.kind == 'daily'
        run: |
          f="inbox/matcha/$(date +%F).md"
          [ -f "$f" ] && { echo "input exists: $f"; exit 0; }
          echo "input missing: $f → collecting now"
          curl -sSL -o /usr/local/bin/matcha "https://github.com/piqoni/matcha/releases/download/v0.9.0/matcha-linux-amd64"
          chmod +x /usr/local/bin/matcha
          scripts/collect.sh
      - name: Install Claude Code
        if: steps.kind.outputs.kind != 'skip'
        run: npm install -g @anthropic-ai/claude-code
      - name: Check auth only
        if: steps.kind.outputs.kind == 'check'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: claude -p "動作確認です。「OK」とだけ返してください。" --allowedTools "Read"
      - name: Run curation
        if: steps.kind.outputs.kind != 'check' && steps.kind.outputs.kind != 'skip'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: scripts/curate.sh "${{ steps.kind.outputs.kind }}"
      - name: Add images
        if: steps.kind.outputs.kind != 'check' && steps.kind.outputs.kind != 'skip'
        run: python3 scripts/add_images.py
      - name: Commit
        id: commit
        if: steps.kind.outputs.kind != 'check' && steps.kind.outputs.kind != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add Digest Weekly wiki _system/news inbox _system/matcha/matcha.db
          git diff --cached --quiet && exit 0
          git commit -m "Curate ${{ steps.kind.outputs.kind }} $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && echo "pushed=1" >> "$GITHUB_OUTPUT" && exit 0; sleep 5; done
          exit 1
      # GITHUB_TOKEN での push は他のワークフローを起動しないので、Pages のデプロイを明示的に呼ぶ
      - name: Deploy site
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
