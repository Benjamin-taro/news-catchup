# Matcha 0.9.0 config (Phase 1: 集める)
# 実行: scripts/collect.sh が matcha -c でこのファイルを読む（GitHub Actions: .github/workflows/collect.yml）
# パスはリポジトリのルートからの相対パス（collect.sh がルートに cd してから実行する）
# 出力: <markdown_dir_path>/YYYY-MM-DD.md （同日に再実行すると上書き再生成）
# 注意: フィード行は「URL<半角スペース>件数」。URL 内に空白を入れないこと（空白で分割される）。
#       件数省略時は 20。フィードは 10〜12 本まで。

markdown_dir_path: "inbox/matcha"
database_file_path: "_system/matcha/matcha.db"

feeds:
  # --- 人気度プロキシ型（S/N 比が高い） ---
  - https://hnrss.org/best 10
  - https://b.hatena.ne.jp/hotentry/it.rss 10
  - https://lobste.rs/rss 5
  # --- スタック専門 ---
  - https://spring.io/blog.atom 5
  - https://zenn.dev/topics/kubernetes/feed 5
  - https://www.publickey1.jp/atom.xml 5
  - https://inside.java/feed.xml 3
  - https://www.redhat.com/en/rss/blog/channel/red-hat-openshift 3
  # --- 深さ枠（週 1〜数本） ---
  - https://newsletter.pragmaticengineer.com/feed 3
  - https://blog.bytebytego.com/feed 3
  # --- X（旧 Twitter）の話題の投稿：Google News の site:x.com 検索、直近 2 日 ---
  - https://news.google.com/rss/search?q=site%3Ax.com%20%28AI%20OR%20%E7%94%9F%E6%88%90AI%20OR%20Claude%20OR%20ChatGPT%20OR%20Codex%29%20%28%E3%82%A8%E3%83%B3%E3%82%B8%E3%83%8B%E3%82%A2%20OR%20%E9%96%8B%E7%99%BA%20OR%20%E6%A5%AD%E5%8B%99%20OR%20%E4%BB%95%E4%BA%8B%29%20when%3A2d&hl=ja&gl=JP&ceid=JP:ja 10
  # --- Google Alerts の RSS（4-1 で取得したら下のコメントを外して置き換える） ---
  - https://www.google.com/alerts/feeds/05042959136347932292/6290204638768659933 5   # AI × 金融
  

# Google News 検索（Matcha 内部で OR 検索 1 本のフィードになり、上限 15 件固定）
# 複数語は "..." で囲む（囲まないと語ごとに AND 扱いになり 0 件になる）。日本語は Google Alerts 側で拾う
google_news_keywords: '"Forward Deployed Engineer","enterprise AI","AI in banking","AI coding"'

# --- 使わない機能は明示的に無効化 ---
instapaper: false
terminal_mode: false
reading_time: false
sunrise_sunset: false
show_images: false
# 天気: 緯度経度が両方 0 なら表示しない
weather_latitude: 0
weather_longitude: 0

# LLM 要約・Analyst は使わない（絞る段階は Cowork に任せる）
# summary_feeds / analyst_feeds / analyst_prompt を空にしておけば LLM は呼ばれない
openai_api_key:
openai_base_url:
openai_model:
summary_feeds:
analyst_feeds:
analyst_prompt:
